# Netlify publishes docs/ only. The build encrypts data/garmin.json into
# docs/data.js with DASHBOARD_PASSWORD, so the raw data is never served.
# With DASHBOARD_GITHUB_TOKEN set the page reads data live from GitHub, and
# data-only commits skip the build (production deploys cost Netlify credits).
[build]
  command = "node scripts/encrypt-data.mjs"
  publish = "docs"
  ignore = "node scripts/should-build.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
